# Use DecapBridge PKCE auth
backend:
  name: git-gateway
  repo: akibaguildtenten-source/jintore-site
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/3316a7d2-7aaf-49ad-a69a-d8e699715cd3/pkce
  auth_token_endpoint: /sites/3316a7d2-7aaf-49ad-a69a-d8e699715cd3/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://jintore-site.pages.dev

media_folder: "images"
public_folder: "/images"

locale: "ja"

collections:
  - name: "site"
    label: "サイトの中身"
    files:
      - name: "content"
        label: "ホームページの中身"
        file: "content.json"
        description: "お知らせ・動画・書籍などをここで編集します。保存すると自動で公開されます。"
        fields:
          - { label: "「体験したい方へ」リンク先", name: "experienceUrl", widget: "string" }
          - { label: "公式LINEのURL", name: "lineUrl", widget: "string" }
          - { label: "「これまでの活動：もっと見る」リンク先", name: "newsMoreUrl", widget: "string" }

          - label: "お知らせ"
            name: "announcements"
            widget: "list"
            label_singular: "お知らせ"
            summary: "{{fields.status}}｜{{fields.tag}}｜{{fields.title}}"
            fields:
              - { label: "記事ID", name: "id", widget: "hidden", required: false }
              - { label: "旧URL番号", name: "legacyIndex", widget: "hidden", required: false }
              - label: "掲載状態"
                name: "status"
                widget: "select"
                default: "published"
                hint: "トップから外すときは「アーカイブ」を選んで保存。リストから削除した公開済みのお知らせも、保存時にアーカイブとして残ります。非表示は画面上の非表示で、保存データへのアクセス制限ではありません。"
                options:
                  - { label: "掲載中", value: "published" }
                  - { label: "アーカイブ（記事を残してトップから外す）", value: "archived" }
                  - { label: "非表示（一覧・記事に表示しない）", value: "hidden" }
              - { label: "ラベル（例：新刊書籍／緊急告知／重要）", name: "tag", widget: "string" }
              - { label: "日付・期間（任意）", name: "date", widget: "string", required: false }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "本文", name: "body", widget: "text" }
              - { label: "強調枠にする", name: "important", widget: "boolean", default: false, required: false }

              - label: "画像（最大3枚・任意）"
                name: "images"
                widget: "list"
                required: false
                max: 3
                field: { label: "画像", name: "image", widget: "image" }

              - label: "本文ブロック（任意・使うと上の「本文」より優先されます／画像を好きな位置に挟めます）"
                name: "blocks"
                widget: "list"
                required: false
                summary: "{{fields.text}}"
                fields:
                  - { label: "文章", name: "text", widget: "text", required: false }
                  - label: "文字の色"
                    name: "color"
                    widget: "select"
                    default: "normal"
                    options:
                      - { label: "通常（黒）", value: "normal" }
                      - { label: "濃紺（強調）", value: "navy" }
                      - { label: "朱色（強調）", value: "red" }
                  - label: "文字の大きさ"
                    name: "size"
                    widget: "select"
                    default: "normal"
                    options:
                      - { label: "標準", value: "normal" }
                      - { label: "大きめ", value: "large" }
                      - { label: "小さめ", value: "small" }
                  - { label: "このブロックの後に置く画像（任意）", name: "image", widget: "image", required: false }

              - { label: "動画URL（YouTube/Vimeo・任意）", name: "videoUrl", widget: "string", required: false }
              - { label: "動画ファイル（任意）", name: "video", widget: "file", required: false }

              - { label: "リンクURL①（任意）", name: "url", widget: "string", required: false }
              - { label: "リンクURL①の表示名（任意）", name: "urlLabel", widget: "string", required: false }
              - { label: "リンクURL②（任意）", name: "url2", widget: "string", required: false }
              - { label: "リンクURL②の表示名（任意）", name: "url2Label", widget: "string", required: false }
              - { label: "リンクURL③（任意）", name: "url3", widget: "string", required: false }
              - { label: "リンクURL③の表示名（任意）", name: "url3Label", widget: "string", required: false }

          - label: "動画（YouTube）"
            name: "videos"
            widget: "list"
            label_singular: "動画"
            summary: "{{fields.title}}"
            fields:
              - { label: "YouTube ID（watch?v= の後ろ）", name: "id", widget: "string" }
              - { label: "タイトル", name: "title", widget: "string" }

          - label: "書籍"
            name: "books"
            widget: "list"
            label_singular: "書籍"
            summary: "{{fields.title}}"
            fields:
              - { label: "書名", name: "title", widget: "string" }
              - { label: "ラベル（例：Kindle）", name: "tag", widget: "string", required: false }
              - { label: "価格（任意）", name: "price", widget: "string", required: false }
              - { label: "説明", name: "desc", widget: "text", required: false }
              - { label: "仮表紙の大見出し", name: "cover", widget: "string", required: false }
              - { label: "仮表紙の小見出し", name: "coverSub", widget: "string", required: false }
              - { label: "表紙画像（任意）", name: "img", widget: "image", required: false }
              - { label: "動画URL（YouTube/Vimeo・任意）", name: "videoUrl", widget: "string", required: false }
              - { label: "動画ファイル（任意）", name: "video", widget: "file", required: false }

              - label: "購入リンク"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - { label: "表示名", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "枠線スタイル", name: "alt", widget: "boolean", default: false, required: false }

          - label: "映像作品（DVD）"
            name: "dvd"
            widget: "list"
            label_singular: "DVD"
            summary: "{{fields.title}}"
            required: false
            fields:
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "ラベル", name: "tag", widget: "string", required: false }
              - { label: "価格（任意）", name: "price", widget: "string", required: false }
              - { label: "説明", name: "desc", widget: "text", required: false }
              - { label: "仮表紙の大見出し", name: "cover", widget: "string", required: false }
              - { label: "仮表紙の小見出し", name: "coverSub", widget: "string", required: false }
              - { label: "表紙画像（任意）", name: "img", widget: "image", required: false }
              - { label: "動画URL（YouTube/Vimeo・任意）", name: "videoUrl", widget: "string", required: false }
              - { label: "動画ファイル（任意）", name: "video", widget: "file", required: false }

              - label: "購入リンク"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - { label: "表示名", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "枠線スタイル", name: "alt", widget: "boolean", default: false, required: false }

          - label: "これまでの活動"
            name: "news"
            widget: "list"
            label_singular: "最新情報"
            summary: "{{fields.date}}｜{{fields.title}}"
            fields:
              - { label: "日付（例：2025.05.08）", name: "date", widget: "string" }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "リンクURL（外部サイトがある場合・任意）", name: "url", widget: "string", required: false }
              - label: "本文ブロック（任意・画像を好きな位置に挟めます）"
                name: "blocks"
                widget: "list"
                required: false
                summary: "{{fields.text}}"
                fields:
                  - { label: "文章", name: "text", widget: "text", required: false }
                  - label: "文字の色"
                    name: "color"
                    widget: "select"
                    default: "normal"
                    options:
                      - { label: "通常（黒）", value: "normal" }
                      - { label: "濃紺（強調）", value: "navy" }
                      - { label: "朱色（強調）", value: "red" }
                  - label: "文字の大きさ"
                    name: "size"
                    widget: "select"
                    default: "normal"
                    options:
                      - { label: "標準", value: "normal" }
                      - { label: "大きめ", value: "large" }
                      - { label: "小さめ", value: "small" }
                  - { label: "このブロックの後に置く画像（任意）", name: "image", widget: "image", required: false }

          - label: "メディア掲載"
            name: "media"
            widget: "list"
            label_singular: "掲載"
            summary: "{{fields.title}}"
            required: false
            fields:
              - { label: "種別（例：雑誌／WEB記事）", name: "kind", widget: "string" }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "本文（任意）", name: "body", widget: "text", required: false }
              - label: "画像（最大3枚・任意）"
                name: "images"
                widget: "list"
                required: false
                max: 3
                field: { label: "画像", name: "image", widget: "image" }
              - label: "本文ブロック（任意・使うと上の「本文」より優先されます／画像を好きな位置に挟めます）"
                name: "blocks"
                widget: "list"
                required: false
                summary: "{{fields.text}}"
                fields:
                  - { label: "文章", name: "text", widget: "text", required: false }
                  - label: "文字の色"
                    name: "color"
                    widget: "select"
                    default: "normal"
                    options:
                      - { label: "通常（黒）", value: "normal" }
                      - { label: "濃紺（強調）", value: "navy" }
                      - { label: "朱色（強調）", value: "red" }
                  - label: "文字の大きさ"
                    name: "size"
                    widget: "select"
                    default: "normal"
                    options:
                      - { label: "標準", value: "normal" }
                      - { label: "大きめ", value: "large" }
                      - { label: "小さめ", value: "small" }
                  - { label: "このブロックの後に置く画像（任意）", name: "image", widget: "image", required: false }
              - { label: "動画URL（YouTube/Vimeo・任意）", name: "videoUrl", widget: "string", required: false }
              - { label: "動画ファイル（任意）", name: "video", widget: "file", required: false }
              - { label: "リンクURL①（任意）", name: "url", widget: "string", required: false }
              - { label: "リンクURL①の表示名（任意）", name: "urlLabel", widget: "string", required: false }
              - { label: "リンクURL②（任意）", name: "url2", widget: "string", required: false }
              - { label: "リンクURL②の表示名（任意）", name: "url2Label", widget: "string", required: false }

          - label: "5つの靭トレ"
            name: "union"
            widget: "list"
            label_singular: "ジャンル"
            summary: "{{fields.ja}}"
            fields:
              - { label: "英語ラベル", name: "en", widget: "string" }
              - { label: "名称", name: "ja", widget: "string" }

          - label: "活動内容（文章の箇条書き）"
            name: "activities"
            widget: "list"

          - label: "体験ページのお知らせ"
            name: "taikenNews"
            widget: "list"
            label_singular: "お知らせ"
            summary: "{{fields.date}}｜{{fields.title}}"
            fields:
              - { label: "日付・ラベル", name: "date", widget: "string" }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "リンクURL", name: "url", widget: "string" }
              - { label: "「ご案内」バッジ", name: "pin", widget: "boolean", default: false, required: false }

          - label: "SNS"
            name: "sns"
            widget: "list"
            label_singular: "SNS"
            summary: "{{fields.label}}"
            required: false
            fields:
              - { label: "表示名", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }


      - name: "archive-content"
        label: "旧ホームページの記録"
        file: "archive.json"
        description: "旧HPの文章・画像を新サイトに保存した記録です。当時の掲載日は変更せず、現在のお知らせとは分けて管理します。"
        fields:
          - label: "旧ホームページの記録"
            name: "records"
            widget: "list"
            label_singular: "記録"
            summary: "{{fields.date}}｜{{fields.title}}"
            fields:
              - { label: "記事ID", name: "id", widget: "hidden", required: false }
              - { label: "元の掲載日時", name: "originalPublishedAt", widget: "hidden", required: false }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "当時の掲載日", name: "date", widget: "string", required: false, hint: "移した日ではなく元の記事の掲載日。日付が不明な記録は空欄のままにします。" }
              - { label: "旧HPの掲載元URL", name: "sourceUrl", widget: "string", required: false }
              - label: "掲載状態"
                name: "status"
                widget: "select"
                default: "published"
                hint: "非表示は画面上の非表示で、保存データへのアクセス制限ではありません。"
                options:
                  - { label: "公開", value: "published" }
                  - { label: "非表示", value: "hidden" }
              - label: "本文・写真・動画"
                name: "blocks"
                widget: "list"
                required: false
                summary: "{{fields.text}}"
                fields:
                  - { label: "文章", name: "text", widget: "text", required: false }
                  - { label: "文字の色", name: "color", widget: "select", options: ["normal", "navy", "red"], default: "normal", required: false }
                  - { label: "文字の大きさ", name: "size", widget: "select", options: ["normal", "large", "small"], default: "normal", required: false }
                  - { label: "画像", name: "image", widget: "image", required: false }
                  - { label: "画像の説明", name: "alt", widget: "string", required: false }
                  - { label: "動画URL", name: "videoUrl", widget: "string", required: false }
                  - { label: "関連リンク", name: "linkUrl", widget: "string", required: false }
                  - { label: "リンク・動画の表示名", name: "linkLabel", widget: "string", required: false }
