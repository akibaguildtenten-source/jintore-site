<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" type="image/png" href="images/favicon.png">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T84CVQJHX5"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-T84CVQJHX5');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お知らせ | 靭トレ協会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;--paper-2:#f1f5f9;--paper-3:#f8fafc;
  --sumi:#141414;--sumi-soft:#54606b;--line:#e2e8ef;
  --shu:#1f5c9e;--shu-deep:#143f6e;--maxw:820px;
  --disp:"Noto Sans JP",sans-serif;--body:"Noto Sans JP",sans-serif;--mono:"Roboto Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--sumi);font-family:var(--body);line-height:1.85;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
/* header */
header.site{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
header .nav{display:flex;align-items:center;gap:16px;height:62px}
.brand{font-family:var(--disp);font-weight:900;font-size:19px;color:var(--sumi);text-decoration:none;letter-spacing:.04em}
header .sp{flex:1}
.nav a.link{font-size:13.5px;color:var(--sumi-soft);text-decoration:none}
.nav a.link:hover{color:var(--shu)}
/* article */
main{padding:34px 0 60px}
.back{display:inline-block;font-family:var(--mono);font-size:12.5px;color:var(--shu);text-decoration:none;margin-bottom:20px}
.back:hover{text-decoration:underline}
.a-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.a-tag{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;color:#fff;background:var(--shu);padding:4px 10px;border-radius:2px}
.a-date{font-family:var(--mono);font-size:12.5px;color:var(--sumi-soft);letter-spacing:.06em}
h1.a-title{font-family:var(--disp);font-weight:900;font-size:clamp(22px,4vw,30px);line-height:1.5;margin:0 0 22px}
.a-body{font-size:15.5px;line-height:2;color:#2b3138;white-space:pre-wrap;word-break:break-word}
.blk{white-space:pre-wrap;word-break:break-word;line-height:2;margin:0 0 18px}
.blk-size-normal{font-size:15.5px}
.blk-size-large{font-size:18.5px;font-weight:700}
.blk-size-small{font-size:13.5px}
.blk-color-normal{color:#2b3138}
.blk-color-navy{color:#143f6e;font-weight:700}
.blk-color-red{color:#b23a3a;font-weight:700}
.blk-img{width:100%;max-height:480px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:var(--paper-2);display:block;margin:0 0 20px}
.a-images{display:grid;gap:14px;margin:24px 0}
.a-images img{width:100%;max-height:560px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:var(--paper-2);display:block}
.media-video{width:100%;border-radius:8px;margin:20px 0 0;border:1px solid var(--line);display:block}
.media-embed{position:relative;width:100%;aspect-ratio:16/9;margin:20px 0 0;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000}
.media-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.a-link{display:inline-block;margin-top:24px;background:var(--shu);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:12px 24px;border-radius:3px}
.a-link:hover{background:var(--shu-deep)}
.a-links{display:flex;flex-wrap:wrap;gap:12px}
.a-links .a-link{margin-top:24px}
.a-foot{margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.notfound{padding:60px 0;text-align:center;color:var(--sumi-soft)}
footer.site{border-top:1px solid var(--line);padding:26px 0;margin-top:20px}
footer .brand2{font-family:var(--disp);font-weight:900;font-size:15px}
footer p{font-size:12px;color:var(--sumi-soft);margin:8px 0 0}
</style>
</head>
<body>
<header class="site">
  <div class="wrap nav">
    <a href="index.html" class="brand">靭トレ協会</a>
    <span class="sp"></span>
    <a href="index.html#oshirase" class="link">お知らせ一覧</a>
    <a href="index.html" class="link">トップ</a>
  </div>
</header>

<main>
  <div class="wrap">
    <a class="back" href="index.html#oshirase">← お知らせ一覧へ戻る</a>
    <div id="article"><p class="notfound">読み込み中…</p></div>
  </div>
</main>

<footer class="site">
  <div class="wrap">
    <div class="brand2">靭トレ協会</div>
    <p>骨・靭帯を連動させる、からだ本来の動かし方。</p>
  </div>
</footer>

<script>
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function videoEmbed(url, file){
  if(file){ return `<video class="media-video" src="${esc(file)}" controls preload="metadata" playsinline></video>`; }
  if(!url) return "";
  const u = String(url).trim();
  let m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if(m){ return `<div class="media-embed"><iframe src="https://www.youtube.com/embed/${m[1]}" title="YouTube" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`; }
  m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m){ return `<div class="media-embed"><iframe src="https://player.vimeo.com/video/${m[1]}" title="Vimeo" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`; }
  if(/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(u)){ return `<video class="media-video" src="${esc(u)}" controls preload="metadata" playsinline></video>`; }
  return `<a class="a-link" href="${esc(u)}" target="_blank" rel="noopener">動画を見る →</a>`;
}

function getIndex(){
  const p = new URLSearchParams(location.search);
  const i = parseInt(p.get("i"), 10);
  return isNaN(i) ? -1 : i;
}

function render(DATA){
  const list = (DATA && DATA.announcements) || [];
  const i = getIndex();
  const n = (i>=0 && i<list.length) ? list[i] : null;
  const box = document.getElementById("article");
  if(!n){
    box.innerHTML = `<div class="notfound">お知らせが見つかりませんでした。<br><a class="back" href="index.html#oshirase">お知らせ一覧へ戻る</a></div>`;
    return;
  }
  document.title = (n.title ? n.title + " | " : "") + "お知らせ | 靭トレ協会";
  const date = n.date ? `<span class="a-date">${esc(n.date)}</span>` : "";

  // 本文＋画像（上段）と 本文ブロック（下段）の両方を表示
  let imgs = [];
  if(Array.isArray(n.images)) imgs = n.images.filter(Boolean);
  else if(n.image) imgs = [n.image];
  imgs = imgs.slice(0,3);
  const images = imgs.length ? `<div class="a-images">${imgs.map(src=>`<img src="${esc(src)}" alt="" loading="lazy">`).join("")}</div>` : "";
  const legacyBody = n.body ? `<div class="a-body">${esc(n.body)}</div>` : "";

  let blocksHtml = "";
  if(Array.isArray(n.blocks) && n.blocks.length){
    blocksHtml = n.blocks.map(function(b){
      const color = ["normal","navy","red"].includes(b.color) ? b.color : "normal";
      const size = ["normal","large","small"].includes(b.size) ? b.size : "normal";
      const text = b.text ? `<div class="blk blk-color-${color} blk-size-${size}">${esc(b.text)}</div>` : "";
      const img = b.image ? `<img class="blk-img" src="${esc(b.image)}" alt="" loading="lazy">` : "";
      return text + img;
    }).join("");
  }

  const bodyHtml = legacyBody + images + blocksHtml;

  const video = videoEmbed(n.videoUrl, n.video);
  const links = [];
  if(n.url) links.push(`<a class="a-link" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.urlLabel || "詳しく見る①")} →</a>`);
  if(n.url2) links.push(`<a class="a-link" href="${esc(n.url2)}" target="_blank" rel="noopener">${esc(n.url2Label || "詳しく見る②")} →</a>`);
  if(n.url3) links.push(`<a class="a-link" href="${esc(n.url3)}" target="_blank" rel="noopener">${esc(n.url3Label || "詳しく見る③")} →</a>`);
  // 旧形式（link.url / link.label）との後方互換
  if(!links.length && n.link && n.link.url) links.push(`<a class="a-link" href="${esc(n.link.url)}" target="_blank" rel="noopener">${esc(n.link.label||"詳しく見る")} →</a>`);
  const link = links.length ? `<div class="a-links">${links.join("")}</div>` : "";
  box.innerHTML = `
    <div class="a-head"><span class="a-tag">${esc(n.tag||"お知らせ")}</span>${date}</div>
    <h1 class="a-title">${esc(n.title||"")}</h1>
    ${bodyHtml}
    ${video}
    ${link}
    <div class="a-foot"><a class="back" href="index.html#oshirase">← お知らせ一覧へ戻る</a></div>
  `;
}

fetch("content.json",{cache:"no-store"})
  .then(r=>r.json())
  .then(render)
  .catch(e=>{
    console.error("content.json 読込失敗", e);
    document.getElementById("article").innerHTML = `<div class="notfound">読み込みに失敗しました。<br><a class="back" href="index.html">トップへ戻る</a></div>`;
  });
</script>
</body>
</html>
