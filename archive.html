<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動の記録・アーカイブ | 靭トレ協会</title>
<meta name="description" content="靭トレ協会の旧ホームページに掲載した活動・記事と、過去のお知らせを保存したアーカイブです。">
<link rel="canonical" href="https://jintore-site.pages.dev/archive" id="canonical">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
:root{
  --paper:#ffffff;--paper-2:#f1f5f9;--paper-3:#f8fafc;
  --sumi:#141414;--sumi-soft:#54606b;--line:#e2e8ef;
  --shu:#1f5c9e;--shu-deep:#143f6e;--maxw:820px;
  --disp:"Noto Sans JP",sans-serif;--body:"Noto Sans JP",sans-serif;--mono:"Roboto Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--sumi);font-family:var(--body);line-height:1.85;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
/* header */
header.site{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
header .nav{display:flex;align-items:center;gap:16px;height:62px}
.brand{font-family:var(--disp);font-weight:900;font-size:19px;color:var(--sumi);text-decoration:none;letter-spacing:.04em}
header .sp{flex:1}
.nav a.link{font-size:13.5px;color:var(--sumi-soft);text-decoration:none}
.nav a.link:hover{color:var(--shu)}
/* article */
main{padding:34px 0 60px}
.back{display:inline-block;font-family:var(--mono);font-size:12.5px;color:var(--shu);text-decoration:none;margin-bottom:20px}
.back:hover{text-decoration:underline}
.a-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.a-tag{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;color:#fff;background:var(--shu);padding:4px 10px;border-radius:2px}
.a-date{font-family:var(--mono);font-size:12.5px;color:var(--sumi-soft);letter-spacing:.06em}
h1.a-title{font-family:var(--disp);font-weight:900;font-size:clamp(22px,4vw,30px);line-height:1.5;margin:0 0 22px}
.a-body{font-size:15.5px;line-height:2;color:#2b3138;white-space:pre-wrap;word-break:break-word}
.blk{white-space:pre-wrap;word-break:break-word;line-height:2;margin:0 0 18px}
.blk-size-normal{font-size:15.5px}
.blk-size-large{font-size:18.5px;font-weight:700}
.blk-size-small{font-size:13.5px}
.blk-color-normal{color:#2b3138}
.blk-color-navy{color:#143f6e;font-weight:700}
.blk-color-red{color:#b23a3a;font-weight:700}
.blk-img{width:100%;max-height:480px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:var(--paper-2);display:block;margin:0 0 20px}
.a-images{display:grid;gap:14px;margin:24px 0}
.a-images img{width:100%;max-height:560px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:var(--paper-2);display:block}
.media-video{width:100%;border-radius:8px;margin:20px 0 0;border:1px solid var(--line);display:block}
.media-embed{position:relative;width:100%;aspect-ratio:16/9;margin:20px 0 0;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000}
.media-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.a-link{display:inline-block;margin-top:24px;background:var(--shu);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:12px 24px;border-radius:3px}
.a-link:hover{background:var(--shu-deep)}
.a-links{display:flex;flex-wrap:wrap;gap:12px}
.a-links .a-link{margin-top:24px}
.a-foot{margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.notfound{padding:60px 0;text-align:center;color:var(--sumi-soft)}
footer.site{border-top:1px solid var(--line);padding:26px 0;margin-top:20px}
footer .brand2{font-family:var(--disp);font-weight:900;font-size:15px}
footer p{font-size:12px;color:var(--sumi-soft);margin:8px 0 0}
.archive-note{background:var(--paper-2);padding:16px;border-left:3px solid var(--shu);font-size:14px;margin-bottom:24px}

:root{--maxw:980px}
.archive-heading{margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--shu);font-weight:700}
h1{font-size:clamp(24px,5vw,36px);line-height:1.5;margin:8px 0 12px}
.intro{color:var(--sumi-soft);font-size:14px;max-width:720px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 12px}
[hidden]{display:none!important}
.filters button{border:1px solid var(--line);background:var(--paper);color:var(--sumi);font:inherit;font-size:13px;padding:10px 16px;border-radius:3px;cursor:pointer;min-height:44px}
.filters button[aria-pressed="true"]{background:var(--shu);color:#fff;border-color:var(--shu)}
.record-count{font-size:13px;color:var(--sumi-soft);margin-bottom:12px}
.record-card{display:grid;grid-template-columns:1fr 104px;gap:18px;padding:22px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.record-card.no-image{grid-template-columns:1fr}.record-card:hover h2{text-decoration:underline;color:var(--shu)}
.record-card h2{font-size:17px;line-height:1.65;margin:8px 0;font-weight:700}
.record-card p{font-size:13px;color:var(--sumi-soft);margin:0}.record-card img{width:104px;height:85px;object-fit:cover;background:var(--paper-2);align-self:center;border-radius:3px}
.record-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.record-tag{font-size:11px;color:var(--shu);font-weight:700}.record-date{font-size:12px;color:var(--sumi-soft)}
.archive-contact{margin-top:32px;padding:24px;background:var(--paper-2);border-left:3px solid var(--shu)}
.archive-contact h2{font-size:18px;margin:0 0 8px}.archive-contact p{font-size:14px;margin:0 0 12px}.archive-contact a{color:var(--shu);font-weight:700;margin-right:16px;display:inline-block;padding:7px 0}
.source{font-size:12px;color:var(--sumi-soft);overflow-wrap:anywhere;margin-top:28px}.source a{color:var(--shu)}
#archive-records .blk{max-width:820px}.archive-status{padding:16px;background:var(--paper-2);font-size:13px;margin-bottom:24px}
a:focus-visible,button:focus-visible{outline:3px solid var(--shu);outline-offset:3px}
@media(max-width:420px){.record-card{grid-template-columns:1fr 72px;gap:12px}.record-card img{width:72px;height:72px}.wrap{padding:0 18px}.archive-contact{padding:18px}.nav a.link{font-size:12px}}
</style></head>
<body>
<header class="site"><div class="wrap nav"><a href="/" class="brand">靭トレ協会</a><span class="sp"></span><a href="/#oshirase" class="link">お知らせ</a><a href="/taiken" class="link">体験案内</a></div></header>
<main><div class="wrap">
<div class="archive-heading" id="archive-heading"><div class="eyebrow">ARCHIVE</div><h1>活動の記録・アーカイブ</h1><p class="intro">旧ホームページに掲載した記録と、過去のお知らせをまとめています。日付・開催案内などは掲載当時の情報です。</p></div>
<a class="back" id="archive-back" href="/archive" hidden>← アーカイブ一覧へ戻る</a>
<nav class="filters" id="archive-filters" aria-label="記録の種類"><button type="button" data-category="all" aria-pressed="true">すべて</button><button type="button" data-category="old" aria-pressed="false">旧ホームページの記録</button><button type="button" data-category="announcements" aria-pressed="false">過去のお知らせ</button></nav>
<div class="record-count" id="record-count" aria-live="polite"></div>
<div id="archive-records"><p>読み込み中…</p></div>
<noscript>このページの記事表示にはJavaScriptが必要です。</noscript>
<aside class="archive-contact"><h2>現在の体験・お問い合わせ</h2><p>体験をご希望の方は、現在のご案内をご確認ください。</p><a href="/taiken">体験したい方へ →</a><a href="/taiken" id="archive-line">公式LINEで相談する →</a></aside>
</div></main>
<footer class="site"><div class="wrap"><div class="brand2">靭トレ協会</div><p>骨・靭帯を連動させる、からだ本来の動かし方。</p></div></footer>
<script src="/archive-core.js"></script><script src="/archive-page.js"></script>
</body></html>
