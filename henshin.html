<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ご返信フォーム | 靭トレ協会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;--paper-2:#f1f5f9;--paper-3:#f8fafc;
  --sumi:#141414;--soft:#54606b;--line:#e2e8ef;
  --shu:#1f5c9e;--shu-deep:#143f6e;
  --disp:"Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper-3);color:var(--sumi);font-family:var(--disp);line-height:1.8}
.wrap{max-width:560px;margin:0 auto;padding:40px 22px 80px}
.brand{font-weight:900;font-size:18px;text-align:center;margin-bottom:6px}
h1{font-size:19px;font-weight:900;text-align:center;margin:0 0 8px}
.lead{font-size:13.5px;color:var(--soft);text-align:center;margin:0 0 28px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px 22px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
textarea{width:100%;font-family:inherit;font-size:15px;color:var(--sumi);background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-height:160px;resize:vertical}
textarea:focus{outline:none;border-color:var(--shu);background:#fff}
.submit{width:100%;margin-top:16px;background:var(--shu);color:#fff;border:0;font-family:inherit;font-weight:700;font-size:15px;padding:14px;border-radius:5px;cursor:pointer}
.submit:hover{background:var(--shu-deep)}
.submit:disabled{opacity:.5;cursor:default}
.msg{margin-top:16px;font-size:14px;font-weight:700;display:none;text-align:center}
.msg.ok{display:block;color:#1f7a3d}
.msg.ng{display:block;color:#c0392b}
.err{max-width:560px;margin:60px auto;text-align:center;color:var(--soft);padding:0 22px}
</style>
</head>
<body>
<div class="wrap" id="page"></div>

<script>
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

/* ▼ここに、GASのウェブアプリURL（/exec）を貼ってください。 */
const FORM_ENDPOINT = "https://script.google.com/macros/s/AKfycbyK3QyUO48x5JoSJvSu983LJ1TthjjfX1L-x2-LmEGpsxSRHHdX0WkQ3WC0NhbA-JNn/exec";

const params = new URLSearchParams(location.search);
const email = params.get("email") || "";
const token = params.get("token") || "";
const page = document.getElementById("page");

if(!email || !token){
  page.innerHTML = `<div class="err">このページは、担当者からのメールに記載されたURLからアクセスしてください。</div>`;
} else {
  page.innerHTML = `
    <div class="brand">靭トレ協会</div>
    <h1>ご返信フォーム</h1>
    <p class="lead">${esc(email)} 様<br>いただいたご連絡へのご返信はこちらからお願いいたします。</p>
    <div class="card">
      <div class="field">
        <label for="f-body">ご返信内容</label>
        <textarea id="f-body" maxlength="3000" placeholder="こちらにご記入ください"></textarea>
      </div>
      <button class="submit" id="submitBtn" type="button">送信する</button>
      <p class="msg" id="msg"></p>
    </div>
  `;

  const msg = document.getElementById("msg");
  function showMsg(text, ok){ msg.textContent = text; msg.className = "msg " + (ok?"ok":"ng"); }

  document.getElementById("submitBtn").addEventListener("click", async () => {
    const body = document.getElementById("f-body").value.trim();
    if(!body){ showMsg("内容をご入力ください。", false); return; }
    if(!FORM_ENDPOINT){ showMsg("送信先が未設定です（管理者へご連絡ください）。", false); return; }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true; showMsg("送信中…", true);
    try{
      await fetch(FORM_ENDPOINT, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"reply", email, token, body })
      });
      showMsg("送信しました。ありがとうございます。", true);
      document.getElementById("f-body").value = "";
    }catch(e){
      showMsg("送信に失敗しました。時間をおいて再度お試しください。", false);
    }finally{
      btn.disabled = false;
    }
  });
}
</script>
</body>
</html>
